name: Postman E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: postman-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credentials:
    name: Check credentials
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check for the Postman API key
        id: check
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          if [ -z "$POSTMAN_API_KEY" ]; then
            echo "::notice::POSTMAN_API_KEY is not configured - skipping the Postman run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  postman:
    name: Run collection
    needs: credentials
    if: needs.credentials.outputs.ready == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: task_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Start the application
        run: ./mvnw -B spring-boot:run > "$RUNNER_TEMP/app.log" 2>&1 &

      - name: Wait for the application
        run: |
          for attempt in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/tasks || true)
            if [ "$code" != "000" ]; then
              echo "Application answered with HTTP $code after $attempt attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The application did not start within 3 minutes."
          tail -n 80 "$RUNNER_TEMP/app.log"
          exit 1

      - name: Seed sample customers and policies
        run: docker exec -i ${{ job.services.mysql.id }} mysql -uroot -proot task_db < ci/seed.sql

      - name: Install the Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sudo sh

      - name: Authenticate with Postman
        run: postman login --with-api-key "$POSTMAN_API_KEY"

      - name: Run the collection
        run: >-
          postman collection run TaskSystem.postman_collection.json
          -r cli,junit
          --reporter-junit-export "$RUNNER_TEMP/postman-results.xml"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postman-results
          path: |
            ${{ runner.temp }}/postman-results.xml
            ${{ runner.temp }}/app.log
          if-no-files-found: ignore
